<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="https://wallpapercave.com/wp/wp5432179.jpg" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LastCore | Dashboards</title>


    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- scripts do Chart.js - 2022-1 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!--FONT AWESOME-->
    <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>
</head>

<!-- <body onload=" atualizarFeed()"> -->

<body>

    <div class="janela">
        <div class="header-left">
            <h1>LastCore</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav">

                <h3>Dashboard</h3>

            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <a href="index.html"></a>
                <h3>Sair</h3>
            </div>

        </div>

        <div class="conteudo-dashboard">
            <div class="dash">
                <div class="card-dash">
                    <h2>Total de Jogadores</h2>
                    <span id="span_jogadores">0</span>
                </div>

                <div class="card-dash">
                    <h2>Total de Respostas</h2>
                    <span id="span_respostas">0</span>
                </div>

                <div class="card-dash">
                    <h2>Perfil Comum</h2>
                    <span id="span_perfil">-</span>
                </div>
            </div>

            <div id="graficos">
                <div class="graph">
                    <h2>Maior Medo</h2>
                    <canvas id="graficoMedo"></canvas>
                </div>

                <div class="card-dash">
                    <h2>Taxa de Sobrevivência</h2>
                    <span id="span_taxa">0%</span>
                </div>

                <div class="card-dash">
                    <h2>Lugar de Sobrevivência</h2>
                    <span id="span_risco">0</span>
                </div>

                <div class="graph">
                    <h2>Perfil dos Jogadores</h2>
                    <canvas id="graficoPerfil"></canvas>
                </div>
            </div>
        </div>
    </div>
    </div>


</body>

</html>

<script>
    var coresTLOU = [
        '#4caf50',
        '#e6005a',
        '#32b9cd',
        '#e3b062',
        '#2d5a2d',
    ];

    var opcoesGrafico = {
        responsive: true,
        plugins: {
            legend: {
                labels: {
                    color: '#d4d4d4',
                    font: { family: 'Barlow', size: 12 }
                }
            }
        },
        scales: {
            x: {
                ticks: { color: '#6b7c6b', font: { size: 11 } },
                grid: { color: '#243024' }
            },
            y: {
                ticks: { color: '#6b7c6b' },
                grid: { color: '#243024' },
                beginAtZero: true
            }
        }
    };

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    window.onload = carregarDashboard();

    function carregarDashboard() {

        buscarCards();
        buscarMedos();
        buscarPerfis();

    }

    function buscarCards() {

        fetch('/dashboard/cards')
            .then(function (resposta) {

                resposta.json().then(function (dados) {
                    span_jogadores.innerHTML = dados.totalUsuarios;
                    span_respostas.innerHTML = dados.totalRespostas;
                    span_perfil.innerHTML = dados.perfilPopular;
                });
            });

        fetch('/dashboard/taxa/' + sessionStorage.ID_USUARIO)
            .then(function (resposta) {
                resposta.json().then(function (dados) {
                    var taxa = (dados.mesmoLugarUsuarios / dados.totalUsuarios) * 100;

                    span_taxa.innerHTML = taxa.toFixed(1) + "%";
                    span_risco.innerHTML = dados.lugarEscolhido;
                });
            });
    }

    function buscarMedos() {
        fetch('/dashboard/medos')
            .then(function (resposta) {
                resposta.json().then(function (dados) {
                    plotarGraficoMedo(dados);
                });
            });
    }

    function buscarPerfis() {
        fetch('/dashboard/perfis')
            .then(function (resposta) {
                resposta.json().then(function (dados) {
                    plotarGraficoPerfil(dados);
                });
            });
    }

    function buscarEscolhasLugar() {
        fetch('/dashboard/lugar')
            .then(function (resposta) {
                resposta.json().then(function (dados) {
                    plotarGraficoLugar(dados);
                });
            });
    }

    function plotarGraficoMedo(dados) {
        var labels = [];
        var valores = [];

        for (var i = 0; i < dados.length; i++) {
            labels.push(dados[i].texto);
            valores.push(dados[i].total);
        }
        new Chart(document.getElementById('graficoMedo'), {
            type: 'bar',

            data: {
                labels: labels,

                datasets: [{
                    label: 'Respostas',
                    data: valores,
                    backgroundColor: coresTLOU,
                    borderColor: '#111311',
                    borderWidth: 2,
                    borderRadius: 6
                }]
            },
            options: opcoesGrafico
        });
    }

    function plotarGraficoPerfil(dados) {
        var labels = [];
        var valores = [];

        for (var i = 0; i < dados.length; i++) {
            labels.push(dados[i].texto);
            valores.push(dados[i].total);
        }
        new Chart(document.getElementById('graficoPerfil'), {
            type: 'bar',

            data: {
                labels: labels,

                datasets: [{
                    label: 'Perfis',
                    data: valores,
                    borderWidth: 3,
                    backgroundColor: coresTLOU,
                    borderColor: '#111311'
                }]
            },

            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: '#d4d4d4',
                            font: { family: 'Barlow', size: 11 },
                            padding: 16,
                            boxWidth: 14
                        }
                    }
                }
            }
        });
    }

    function plotarGraficoLugar(dados) {
        var labels = [];
        var valores = [];

        for (var i = 0; i < dados.length; i++) {
            labels.push(dados[i].texto);
            valores.push(dados[i].total);
        }
        new Chart(document.getElementById('graficoLugar'), {
            type: 'pie',

            data: {
                labels: labels,

                datasets: [{
                    label: 'Lugar',
                    data: valores,
                    borderWidth: 1
                }]
            },

            options: {
                responsive: true
            }
        });
    }
</script>
