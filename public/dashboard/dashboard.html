<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LastCore | Dashboards</title>


    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- scripts do Chart.js - 2022-1 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!--FONT AWESOME-->
    <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>
</head>

<!-- <body onload=" atualizarFeed()"> -->

<body>

    <div class="janela">
        <div class="header-left">
            <h1>LastCore</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="./cards.html">
                    <h3>Missões</h3>
                </a>
            </div>

            <div class="btn-nav">

                <h3>Dashboard</h3>

            </div>

            <div class="btn-nav-white">
                <a href="./mural.html">
                    <h3>Informações</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <a href="index.html"></a>
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash">
            <div class="card">
                <h2>Total de Jogadores</h2>
                <span id="span_jogadores">0</span>
            </div>

            <div class="card">
                <h2>Total de Respostas</h2>
                <span id="span_respostas">0</span>
            </div>

            <div class="card">
                <h2>Perfil Comum</h2>
                <span id="span_perfil">-</span>
            </div>
        </div>

        <div id="graficos">
            <div class="graph">
                <h2>Maior Medo</h2>
                <canvas id="graficoMedo"></canvas>
            </div>

            <div class="graph">
                <h2>Perfil dos Jogadores</h2>
                <canvas id="graficoPerfil"></canvas>
            </div>
        </div>
    </div>
    </div>


</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    window.onload = carregarDashboard();

    function carregarDashboard() {

        buscarCards();
        buscarMedos();
        buscarPerfis();

    }

    function buscarCards() {

        fetch('/dashboard/cards')
            .then(function (resposta) {

                resposta.json().then(function (dados) {
                    span_jogadores.innerHTML = dados.totalUsuarios;
                    span_respostas.innerHTML = dados.totalRespostas;
                    span_perfil.innerHTML = dados.perfilPopular;
                });
            });
    }

    function buscarMedos() {
        fetch('/dashboard/medos')
            .then(function (resposta) {
                resposta.json().then(function (dados) {
                    plotarGraficoMedo(dados);
                });
            });
    }

    function buscarPerfis() {
        fetch('/dashboard/perfis')
            .then(function (resposta) {
                resposta.json().then(function (dados) {
                    plotarGraficoPerfil(dados);
                });
            });
    }

    function plotarGraficoMedo(dados) {
        var labels = [];
        var valores = [];

        for (var i = 0; i < dados.length; i++) {
            labels.push(dados[i].texto);
            valores.push(dados[i].total);
        }
        new Chart(document.getElementById('graficoMedo'), {
            type: 'bar',

            data: {
                labels: labels,

                datasets: [{
                    label: 'Quantidade de respostas',
                    data: valores,
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true
            }
        });
    }

    function plotarGraficoPerfil(dados) {
        var labels = [];
        var valores = [];

        for (var i = 0; i < dados.length; i++) {
            labels.push(dados[i].texto);
            labels.push(dados[i].total);
        }
        new Chart(document.getElementById('graficoPerfil'), {
            type: 'pie',

            data: {
                labels: labels,

                datasets: [{
                    label: 'Perfis',
                    data: valores,
                    borderWidth: 1
                }]
            },

            options: {
                responsive: true
            }
        });
    }
</script>
