<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>LastCore | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="icon" href="https://wallpapercave.com/wp/wp5432179.jpg" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>
  <div class="header">
    <div class="container">
      <h1 class="titulo">LastCore</h1>
      <ul class="navbar">
        <li>
          <a href="index.html">Inicial</a>
        </li>
        <li>
          <a href="quiz.html">Quiz</a>
        </li>
        <li>|</li>
        <li>
          <a href="login.html">Login</a>
        </li>
        <li class="agora">
          <a href="#">Cadastro</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="cadastro">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Bem-vindo ao LastCore!</h2>
        <div class="formulario">
<br>
          <div class="campo">
            <span>Digite seu nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>
          <button class="botao" onclick="cadastrar()">Cadastrar</button>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>
        <div class="cadastro-login">
          <h4>Já possui cadastro? <a href="./login.html">Faça o seu login!</a></h4>
        </div>

        <div id="div_erros_cadastro"></div>
      </div>
    </div>
  </div>

</body>

</html>

<script>

  function cadastrar() {
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var idUsuarioAtual;


    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      alert("Todos os campos devem ser preenchidos.");
      return false;
    }

    if (emailVar != emailVar.toLowerCase()) {
      alert("Seu e-mail deve ser constituído apenas com letras minúsculas.");
      return false;
    }


    if (emailVar.indexOf("@") == -1 || emailVar.indexOf(".") == -1) {
      alert("Formato de e-mail inválido, tente novamente.");
      return false;
    }


    var especiais = "!@#$%^&*()_+{}[]|:;,.<>?";
    var temEspecial = false;
    for (var i = 0; i < senhaVar.length; i++) {
      if (especiais.indexOf(senhaVar[i]) != -1) {
        temEspecial = true;
        break;
      }
    }
    if (!temEspecial) {
      alert("Deve conter pelo menos um caractere especial.");
      return false;
    }


    var temNumero = false;
    for (var i = 0; i < senhaVar.length; i++) {
      if (!isNaN(senhaVar[i]) && senhaVar[i] != " ") {
        temNumero = true;
        break;
      }
    }
    if (!temNumero) {
      alert("A senha deve conter pelo menos um número.");
      return false;
    }

    var temMaiuscula = false;
    for (var i = 0; i < senhaVar.length; i++) {
      if (senhaVar[i] >= "A" && senhaVar[i] <= "Z") {
        temMaiuscula = true;
        break;
      }
    }
    if (!temMaiuscula) {
      alert("Sua senha deve conter pelo menos uma letra maiúscula.");
      return false;
    }


    if (senhaVar != confirmacaoSenhaVar) {
      alert("As senhas não são iguais.");
      return false;
    }

    console.log("Tentando cadastrar:", nomeVar, emailVar);

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
    })
      .then(function (resposta) {
        if (resposta.ok) {
          mostrarErro("Cadastro realizado com sucesso! Redirecionando...");
          setTimeout(() => {
            window.location = "login.html";
          }, 2000);
        } else {
          mostrarErro("Houve um erro ao tentar realizar o cadastro!");
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        mostrarErro("Erro inesperado no cadastro.");
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }

  function mostrarErro(msg) {
    cardErro.style.display = "block";
    mensagem_erro.innerHTML = msg;
    setInterval(sumirMensagem, 5000);
  }
</script>
