<!DOCTYPE html>

    <link rel="stylesheet" href="./css/login.css">
    <link rel="icon" href="https://wallpapercave.com/wp/wp5432179.jpg">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>

    <div class="header">
        <div class="container">
            <h1 class="titulo">LastCore</h1>
            <ul class="navbar">
                <li>
                    <a href="index.html">Inicial</a>
                </li>
                <li>
                    <a href="quiz.html">Quiz</a>
                </li>
                <li>|</li>
                <li class="agora">
                    <a href="#">Login</a>
                </li>
                <li>
                    <a href="cadastro.html">Cadastro</a>
                </li>
            </ul>
        </div>
    </div>


    <div class="login">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="container">
            <div class="card card-login">
                <h2>Seja bem-vindo de volta!</h2>
                <br>
                <div class="formulario">
                    <div class="campo">
                        <span>E-mail:</span>
                        <input id="email_input" type="text" placeholder="Login">
                    </div>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******">
                    </div>
                    <button class="botao" onclick="entrar()">Entrar</button>
                </div>

                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif">
                </div>

                <div id="div_erros_login"></div>
            </div>

    </div>

</body>

</html>

<script>

function entrar() {
  aguardar();

  var emailVar = email_input.value;
  var senhaVar = senha_input.value;

  if (emailVar == "" || senhaVar == "") {
    mostrarErro("Todos os campos devem ser preenchidos.");
    finalizarAguardar();
    return false;
  }

  if (emailVar != emailVar.toLowerCase()) {
    mostrarErro("O e-mail deve ser digitado apenas em letras minúsculas.");
    finalizarAguardar();
    return false;
  }

  if (emailVar.indexOf("@") == -1 || emailVar.indexOf(".") == -1) {
    mostrarErro("Formato de e-mail inválido.");
    finalizarAguardar();
    return false;
  }

  var especiais = "!@#$%^&*()_+{}[]|:;,.<>?";
  var caractereEspecial = false;
  for (var i = 0; i < senhaVar.length; i++) {
    if (especiais.indexOf(senhaVar[i]) != -1) {
      caractereEspecial = true;
      break;
    }
  }
  if (!caractereEspecial) {
    mostrarErro("A senha deve conter pelo menos um caractere especial.");
    finalizarAguardar();
    return false;
  }

  var Numero = false;
  for (var i = 0; i < senhaVar.length; i++) {
    if (!isNaN(senhaVar[i]) && senhaVar[i] != " ") {
      Numero = true;
      break;
    }
  }
  if (!Numero) {
    mostrarErro("A senha deve conter pelo menos um número.");
    finalizarAguardar();
    return false;
  }

  var letraMaiuscula = false;
  for (var i = 0; i < senhaVar.length; i++) {
    if (senhaVar[i] >= "A" && senhaVar[i] <= "Z") {
      letraMaiuscula = true;
      break;
    }
  }
  if (!letraMaiuscula) {
    mostrarErro("A senha deve conter pelo menos uma letra maiúscula.");
    finalizarAguardar();
    return false;
  }

  console.log("FORM LOGIN: ", emailVar);
  console.log("FORM SENHA: ", senhaVar);

  fetch("/usuarios/autenticar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      emailServer: emailVar,
      senhaServer: senhaVar
    })
  }).then(function (resposta) {
    if (resposta.ok) {
      resposta.json().then(json => {
        sessionStorage.EMAIL_USUARIO = json.email;
        sessionStorage.NOME_USUARIO = json.nome;
        sessionStorage.ID_USUARIO = json.id;
        sessionStorage.AQUARIOS = JSON.stringify(json.aquarios);

        mostrarSucesso("Login realizado com sucesso! Redirecionando...");
        setTimeout(function () {
          window.location.href = "quiz.html";
        }, 1000);
      });
    } else {
      resposta.text().then(texto => {
        mostrarErro("E-mail ou senha incorretos.");
        finalizarAguardar(texto);
      });
    }
  }).catch(function (erro) {
    console.log(erro);
    mostrarErro("Erro inesperado no login.");
  });

  return false;
}

function mostrarErro(msg) {
  cardErro.style.display = "block";
  cardErro.style.backgroundColor = "red";
  mensagem_erro.innerHTML = msg;
  setInterval(sumirMensagem, 5000);
}

function mostrarSucesso(msg) {
  cardErro.style.display = "block";
  cardErro.style.backgroundColor = "green";
  mensagem_erro.innerHTML = msg;
}

</script>
