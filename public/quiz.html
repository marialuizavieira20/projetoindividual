<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LastCore | Quiz</title>

    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="icon" href="https://wallpapercave.com/wp/wp5432179.jpg">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>

    <div class="header">
        <div class="container">
            <h1 class="titulo">LastCore</h1>
            <ul class="navbar">
                <li>
                    <a href="./index.html">Inicial</a>
                </li>
                <li class="agora">Quiz</li>
                <li>|</li>
                <li>
                    <a href="./login.html">Login</a>
                </li>
                <li>
                    <a href="./cadastro.html">Cadastro</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="quiz">
        <div class="container">
            <h2>Quiz</h2>
            <form id="quizForm">

                <label> Em um cenário pós-apocalíptico, qual lugar você escolheria para viver? </label> <br> <select
                    id="select_lugar">
                    <option value=""> Escolha uma opção </option>
                    <option value="1"> Seattle </option>
                    <option value="2"> Santa Barbara </option>
                    <option value="3"> Atlanta </option>
                    <option value="4"> Silver Lake </option>
                </select> <br><br>

                <label> Se depois de alguns dias, faltasse comida e mantimentos, o que você faria? </label> <br> <select
                    id="select_comida">
                    <option value=""> Escolha uma opção </option>
                    <option value="5"> Dividiria o pouco que tenho, até a alguma gota de água </option>
                    <option value="6"> Me juntaria em equipe para buscar mantimentos </option>
                    <option value="7"> Tentaria negociar recursos se estivesse em larga escala de pessoas
                    </option>
                    <option value="8"> Procuraria comida sozinho, deixando minha equipe de fora </option>
                </select> <br><br>

                <label> O que mais te causaria medo? </label> <br> <select id="select_medo">
                    <option value=""> Escolha uma opção </option>
                    <option value="9"> Ficar sozinho no meio do apocalipse </option>
                    <option value="10"> Perder pessoas importantes na minha vida </option>
                    <option value="11"> Ser mordido e morrer por conta dos infectados </option>
                    <option value="12"> Pessoas perigosas e gangues </option>
                </select> <br><br>

                <label> Como você resolveria os seus conflitos? </label> <br> <select id="select_conflito">
                    <option value=""> Escolha uma opção </option>
                    <option value="13"> Tentaria conversar, para não tomar nenhuma atitude precipitada </option>
                    <option value="14"> Resolveria na força bruta, pois seria a única maneira </option>
                    <option value="15"> Criaria uma estratégia para analisar a melhor ação naquele cenário
                    </option>
                    <option value="16"> Tentaria evitar a conversa ao máximo, em prol da sobrevivência </option>
                </select> <br><br>

                <label> O que mais importa? </label> <br> <select id="select_importancia">
                    <option value=""> Escolha uma opção </option>
                    <option value="17"> Proteger a minha família e aqueles que amo </option>
                    <option value="18"> Ter liberdade e poder fazer o meu caminho sozinho </option>
                    <option value="19"> Garantir sempre a minha sobrevivência, custe o que custar </option>
                    <option value="20"> Ter sempre um pingo de esperança, tentando observar algum caminho
                        otimista </option>
                </select> <br><br>

                <label> Se você encontrasse um desconhecido ferido à beira da morte, o que faria? </label> <br>
                <select id="select_desconhecido">
                    <option value=""> Escolha uma opção </option>
                    <option value="21"> Iria ajudar sem nem pensar duas vezes </option>
                    <option value="22"> Eu ajudaria, mas tomaria todo o cuidado e ficaria em alerta a todo momento </option>
                    <option value="23"> Iria embora, afinal, não é um problema meu </option>
                    <option value="24"> Observaria com bastante cautela, antes de tomar qualquer decisão </option>
                </select> <br><br>

                <label> Que tipo de pessoa você acredita seria nesse ambiente? </label> <br> <select id="select_perfil">
                    <option value=""> Escolha uma opção </option>
                    <option value="25"> Seria um líder no meu grupo, tomando sempre a iniciativa com coragem
                    </option>
                    <option value="26"> Seria um sobrevivente, que agiria de forma silenciosa </option>
                    <option value="27"> Iria ser muito protetor com todos, lutando sempre pelo meu grupo </option>
                    <option value="28"> Seria um explorador, caminhando sozinho para sobreviver </option>
                </select> <br><br>

                <button type="button" onclick="enviarQuiz()"> Enviar Quiz </button>
            </form>
        </div>
    </div>

</body>

</html>
<script>

    function enviarQuiz() {
        var lugar = select_lugar.value;
        var comida = select_comida.value;
        var medo = select_medo.value;
        var conflito = select_conflito.value;
        var importancia = select_importancia.value;
        var desconhecido = select_desconhecido.value;
        var perfil = select_perfil.value;

        if (
            lugar == "" ||
            comida == "" ||
            medo == "" ||
            conflito == "" ||
            importancia == "" ||
            desconhecido == "" ||
            perfil == ""
        ) {
            alert("Responda todas as perguntas");
        } else if(!sessionStorage.ID_USUARIO) {
        alert('Por favor, se cadastre ou realize o login para fazer o quiz!');
        window.location.href = './login.html';
    }

        else {
            var respostas = [
                {
                    fkPergunta: 1,
                    fkAlternativa: select_lugar.value
                },

                {
                    fkPergunta: 2,
                    fkAlternativa: select_comida.value
                },

                {
                    fkPergunta: 3,
                    fkAlternativa: select_medo.value
                },

                {
                    fkPergunta: 4,
                    fkAlternativa: select_conflito.value
                },

                {
                    fkPergunta: 5,
                    fkAlternativa: select_importancia.value
                },

                {
                    fkPergunta: 6,
                    fkAlternativa: select_desconhecido.value
                },

                {
                    fkPergunta: 7,
                    fkAlternativa: select_perfil.value
                }
            ];

            fetch("/quiz", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    idUsuario: sessionStorage.ID_USUARIO,
                    respostas
                })
            });

            window.location.href = "./dashboard/dashboard.html";
        }
    }
</script>
</body>
</html>
